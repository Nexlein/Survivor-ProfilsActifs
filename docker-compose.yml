version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: profilsactifs-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: profilsactifs
    ports:
      - "5432:5432"
    volumes:
      - profilsactifs_pgdata:/var/lib/postgresql/data

volumes:
  profilsactifs_pgdata:
