name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Install EVERYTHING at the root level using the master package-lock.json
      - run: npm ci

      # 2. Build Backend
      - run: cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profilsactifs
      - run: npm run build --workspace=backend

      # 3. Build Frontend
      - run: npm run build --workspace=frontend

      # 4. Upload build artifacts
      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: warn
          retention-days: 7
