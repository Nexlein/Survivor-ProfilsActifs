name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profilsactifs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Install everything
      - run: npm ci

      # 2. Generate Prisma client + push schema + seed
      - run: cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profilsactifs
      - run: cd backend && npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profilsactifs
      - run: cd backend && npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profilsactifs

      # 3. Build backend
      - run: npm run build --workspace=backend

      # 4. Build frontend
      - run: cd frontend && npm run build

      # 5. Upload artifacts
      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
