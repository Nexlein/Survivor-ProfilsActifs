name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      # 1. Install EVERYTHING at the root level using the master package-lock.json
      - run: npm ci
      
      # 2. Build Backend
      - run: cd backend && npx prisma generate
      - run: npm run build --workspace=backend
      
      # 3. Build Frontend
      - run: npm run build --workspace=frontend
