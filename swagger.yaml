openapi: 3.0.0
info:
  title: ProfilsActifs API
  description: "TikTok for the unemployed - Core API Documentation"
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Verifies application and database connectivity.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: string
                    example: "connected"
                  timestamp:
                    type: string
                    example: "2026-09-01T12:00:00.000Z"
        '503':
          description: Service Unavailable (Database is down).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  database:
                    type: string
                    example: "disconnected"
                  message:
                    type: string
                    example: "Service Unavailable"
