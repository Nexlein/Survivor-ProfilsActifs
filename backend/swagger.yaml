openapi: 3.0.0
info:
  title: ProfilsActifs API
  description: "TikTok for the unemployed - Core API Documentation"
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Verifies application and database connectivity.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: string
                    example: "connected"
                  timestamp:
                    type: string
                    example: "2026-09-01T12:00:00.000Z"
        '503':
          description: Service Unavailable (Database is down).

  /auth/register:
    post:
      summary: User Registration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
                fullName:
                  type: string
                  example: Jean Dupont
                role:
                  type: string
                  enum: [JOB_SEEKER, RECRUITER]
                  example: JOB_SEEKER
                dateOfBirth:
                  type: string
                  example: "1998-05-14"
      responses:
        '201':
          description: User created successfully
        '400':
          description: Bad request (missing fields)
        '422':
          description: Age restriction violation (<16 years)

  /auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Successful login, returns JWT token
        '401':
          description: Invalid credentials

  /auth/get-current-user:
    get:
      summary: Get Current User
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful retrieval of current user
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"

  /auth/refresh:
    post:
      summary: Refresh JWT Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token refreshed successfully, returns new JWT token and user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "123e4567-e89b-12d3-a456-426614174000"
                      email:
                        type: string
                        example: jean.dupont@example.fr
                      role:
                        type: string
                        enum: [JOB_SEEKER, RECRUITER]
                        example: JOB_SEEKER
        '401':
          description: Unauthorized (Invalid or missing token)


  /profile:
    get:
      summary: Get Profile of Current User
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile object retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
    put:
      summary: Update Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
    delete:
      summary: Delete Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized

  /profile/me:
    get:
      summary: Consult Active Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active profile details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized

  /profile/all:
    get:
      summary: Get All Profiles
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized

  /profile/user/{id}:
    get:
      summary: Get Profile by User ID
      tags:
        - Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
        '404':
          description: Profile not found

  /video/upload-file:
    post:
      summary: Upload Video File
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
                - profileId
              properties:
                video:
                  type: string
                  format: binary
                  description: The video file to upload
                profileId:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
                consentTextVersion:
                  type: string
                  example: "v1.0"
      responses:
        '201':
          description: Video uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Bad request (missing file or profileId)
        '401':
          description: Unauthorized

  /video/upload-link:
    post:
      summary: Upload Video Link
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoUrl
                - profileId
              properties:
                videoUrl:
                  type: string
                  example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                profileId:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
                consentTextVersion:
                  type: string
                  example: "v1.0"
      responses:
        '201':
          description: Video link created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /video/delete:
    delete:
      summary: Delete Video Profile
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Video deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Video deleted successfully"
                  id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Video ID is required
        '401':
          description: Unauthorized

  /video/get:
    get:
      summary: Get Video Profile
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Video retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Video ID is required
        '401':
          description: Unauthorized

  /video/like:
    post:
      summary: Like a Video
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Video liked successfully (likes count incremented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Video ID is required
        '401':
          description: Unauthorized

  /video/view:
    post:
      summary: Register a Video View
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Video view registered successfully (views count incremented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Video ID is required
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        userId:
          type: string
          format: uuid
          example: "987f6543-e21b-12d3-a456-426614174000"
        fullName:
          type: string
          example: "Jean Dupont"
        targetSector:
          type: string
          nullable: true
          example: "Développement Informatique"
        location:
          type: string
          nullable: true
          example: "Paris"
        certificationScore:
          type: integer
          nullable: true
          example: 85
        hasWorkPermit:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
    ProfileInput:
      type: object
      properties:
        fullName:
          type: string
          example: "Jean Dupont"
        targetSector:
          type: string
          example: "Développement Informatique"
        location:
          type: string
          example: "Paris"
        certificationScore:
          type: integer
          example: 85
        hasWorkPermit:
          type: boolean
          example: true
  /compliance/data-export:
    get:
      summary: Exportation des donnees personnelles (RGPD)
      description: Droit d'acces aux donnees. Renvoie l'integralite des donnees liees au compte.
      tags:
        - Conformite
      responses:
        '200':
          description: Export reussi
        '401':
          description: Non autorise
  /compliance/account:
    delete:
      summary: Droit a l'oubli (RGPD)
      description: Suppression integrale et definitive du compte, y compris les fichiers physiques (.mp4, .vtt).
      tags:
        - Conformite
      responses:
        '200':
          description: Suppression reussie
        '401':
          description: Non autorise
    Video:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        profileId:
          type: string
          format: uuid
          example: "987f6543-e21b-12d3-a456-426614174000"
        type:
          type: string
          enum: [LINK, UPLOAD]
          example: UPLOAD
        url:
          type: string
          example: "/uploads/videos/172528765-video.mp4"
        subtitleUrl:
          type: string
          nullable: true
          example: null
        likes:
          type: integer
          example: 0
        views:
          type: integer
          example: 0
        consentDate:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
        consentTextVersion:
          type: string
          example: "v1.0"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
