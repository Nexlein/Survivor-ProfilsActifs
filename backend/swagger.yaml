openapi: 3.0.0
info:
  title: ProfilsActifs API
  description: "TikTok for the unemployed - Core API Documentation"
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Verifies application and database connectivity.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: string
                    example: "connected"
                  timestamp:
                    type: string
                    example: "2026-09-01T12:00:00.000Z"
        '503':
          description: Service Unavailable (Database is down).

  /auth/register:
    post:
      summary: User Registration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
                fullName:
                  type: string
                  example: Jean Dupont
                role:
                  type: string
                  enum: [JOB_SEEKER, RECRUITER]
                  example: JOB_SEEKER
                dateOfBirth:
                  type: string
                  example: "1998-05-14"
      responses:
        '201':
          description: User created successfully
        '400':
          description: Bad request (missing fields)
        '422':
          description: Age restriction violation (<16 years)

  /auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Successful login, returns JWT token
        '401':
          description: Invalid credentials

  /auth/get-current-user:
    get:
      summary: Get Current User
      tags:
        - Authentication
      responses:
        '200':
          description: Successful retrieval of current user
        '401':
          description: Unauthorized
