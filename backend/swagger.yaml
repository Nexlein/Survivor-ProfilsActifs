openapi: 3.0.0
info:
  title: ProfilsActifs API
  description: ProfilsActifs - Core API Documentation
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Verifies application and database connectivity.
      tags:
        - System
      responses:
        "200":
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    example: "2026-09-01T12:00:00.000Z"
        "503":
          description: Service Unavailable (Database is down).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      summary: User Registration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
                fullName:
                  type: string
                  example: Jean Dupont
                role:
                  type: string
                  enum:
                    - JOB_SEEKER
                    - RECRUITER
                  example: JOB_SEEKER
                dateOfBirth:
                  type: string
                  example: "1998-05-14"
                targetSector:
                  type: string
                  example: Informatique
                location:
                  type: string
                  example: Paris, France
                skills:
                  type: array
                  items:
                    type: string
                  maxItems: 10
                  example:
                    - React
                    - Node.js
                companyName:
                  type: string
                  example: TechCorp
                industry:
                  type: string
                  example: Logiciel
                position:
                  type: string
                  example: CTO
      responses:
        "201":
          description: User created successfully
        "400":
          description: Bad request (missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Age restriction violation (<16 years)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
      responses:
        "200":
          description: Successful login, returns JWT token
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/get-current-user:
    get:
      summary: Get Current User
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful retrieval of current user
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
  /auth/refresh:
    post:
      summary: Refresh JWT Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token refreshed successfully, returns new JWT token and user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000
                      email:
                        type: string
                        example: jean.dupont@example.fr
                      role:
                        type: string
                        enum:
                          - JOB_SEEKER
                          - RECRUITER
                        example: JOB_SEEKER
        "401":
          description: Unauthorized (Invalid or missing token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile:
    get:
      summary: Get Profile of Current User
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile object retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                targetSector:
                  type: string
                location:
                  type: string
                bio:
                  type: string
                companyName:
                  type: string
                industry:
                  type: string
                position:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
                  maxItems: 10
                visible:
                  type: boolean
                  description: Toggles the public visibility of the profile (defaults to true)
                dateOfBirth:
                  type: string
                  format: date-time
                  description: Required to be >= 16 years old to activate profile visibility
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/me:
    get:
      summary: Consult Active Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active profile details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/avatar:
    post:
      summary: Upload / replace profile photo
      description: Accepts a single image file (max 5 MB) and sets it as the current user's avatarUrl.
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded and profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: No file provided or invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/all:
    get:
      summary: Get All Profiles (candidate catalog)
      description: Public — browsable without an account. Server-side paginated, 20 per page. Minors are only included when the caller is authenticated as a RECRUITER; a page past the end returns an empty `profiles` array rather than an error.
      tags:
        - Profile
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated list of profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
                  total:
                    type: integer
                    example: 23
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20
  /profile/user/{id}:
    get:
      summary: Get Profile by User ID
      tags:
        - Profile
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service Unavailable (Degraded Mode Active)
        "403":
          description: "Accès interdit (Profil de mineur)"
  /questionnaire/questions:
    get:
      summary: Get Questionnaire Questions
      tags:
        - Questionnaire
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Questionnaire questions with options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionnaireQuestion"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /questionnaire/progression:
    get:
      summary: Get Candidate Questionnaire Progression
      tags:
        - Questionnaire
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current questionnaire progression for the authenticated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Save Candidate Questionnaire Progression
      tags:
        - Questionnaire
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireProgressInput"
      responses:
        "200":
          description: Questionnaire progression saved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /questionnaire/submit:
    post:
      summary: Submit Questionnaire
      tags:
        - Questionnaire
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Questionnaire submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Questionnaire submitted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compliance/data-export:
    get:
      summary: Personal Data Export (GDPR)
      description: Right of access to data. Returns all personal data associated with the account.
      tags:
        - Compliance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export successful
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compliance/account:
    delete:
      summary: Right to be Forgotten (GDPR)
      description: Full and permanent account deletion, including physical files (.mp4, .vtt).
      tags:
        - Compliance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion successful
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video/play/{id}:
    get:
      summary: Stream a video
      description: Requires authentication (mandatory, not optional). A PENDING/REJECTED video is only playable by its owner or an admin.
      tags:
        - Media
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Full video stream
        "206":
          description: Partial video stream (Range)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (Video is PENDING or REJECTED, and requester is neither owner nor admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "416":
          description: Range Not Satisfiable (malformed or out-of-bounds Range header)
        "503":
          description: Service Unavailable (Degraded Mode Active)
  /video/play/{id}/subtitle:
    get:
      summary: Stream a video's subtitle track (.vtt)
      description: Requires authentication. Same access rule as the video itself — a PENDING/REJECTED video's subtitle is only accessible to its owner or an admin.
      tags:
        - Media
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Subtitle file (text/vtt)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (Video is PENDING or REJECTED, and requester is neither owner nor admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Video or subtitle not found
  /video/feed:
    get:
      summary: Get public video feed
      tags:
        - Video
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated video feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Video"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
  /video/approval:
    put:
      summary: Approve or reject a video (ADMIN only)
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - approved
              properties:
                id:
                  type: string
                  format: uuid
                approved:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Video updated
        "400":
          description: Reason required if rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service Unavailable (Degraded Mode Active)
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/videos:
    post:
      summary: Upload a new video to the profile
      description: LINK-type videos are permanently disabled — only UPLOAD is accepted.
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
              properties:
                type:
                  type: string
                  enum:
                    - UPLOAD
                consentTextVersion:
                  type: string
                video:
                  type: string
                  format: binary
                  description: The video file (MP4, MOV or AVI, max MAX_VIDEO_SIZE_MB)
                subtitle:
                  type: string
                  format: binary
                  description: Optional .vtt subtitle file
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Missing/invalid file, or type is LINK (permanently disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/videos/{id}:
    delete:
      summary: Delete a video physically and logically
      tags:
        - Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video deleted
  /interaction:
    post:
      summary: Enregistrer une interaction (Vue, Favori, Contact)
      description: "LIKE n'est pas supporté : c'est un critère d'engagement banni par le cahier des charges du cabinet."
      tags: [Interaction]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profileId
                - type
              properties:
                profileId:
                  type: string
                type:
                  type: string
                  enum: [VIEW, CONTACT, FAVORITE]
                videoId:
                  type: string
                  nullable: true
                subject:
                  type: string
                  nullable: true
                message:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Interaction créée
        "400":
          description: Requête invalide (ex. objet manquant, texte < 50 chars, ou type LIKE)
  /interaction/notifications:
    get:
      summary: Lister les notifications reçues par le candidat
      tags: [Interaction]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des notifications
  /interaction/{id}/read:
    put:
      summary: Marquer une notification comme lue
      tags: [Interaction]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification mise à jour
  /interaction/sent:
    get:
      summary: Lister les contacts envoyés par un recruteur
      tags: [Interaction]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des messages envoyés
  /interaction/stats:
    get:
      summary: Statistiques d'interactions (dashboard)
      tags: [Interaction]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistiques
  /admin/moderation/queue:
    get:
      summary: List accounts pending moderation (ADMIN only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated queue of PENDING accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        profile:
                          type: object
                          nullable: true
                          properties:
                            fullName:
                              type: string
                            avatarUrl:
                              type: string
                              nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/moderation/{userId}/approve:
    patch:
      summary: Approve a pending account (ADMIN only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account approved
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/moderation/{userId}/reject:
    patch:
      summary: Reject a pending account (ADMIN only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account rejected
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/moderation/{userId}/suspend:
    patch:
      summary: Suspend an account, including a previously-approved one (ADMIN only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account suspended
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/profiles/{id}/hide:
    post:
      summary: Hide a specific profile from the public catalog (ADMIN only)
      description: >-
        Flips Profile.visible to false without touching the account's
        moderationStatus — distinct from suspend, which blocks the whole
        account. The owner can still re-enable it via PUT /profile.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Profile hidden
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          format: uuid
          example: 987f6543-e21b-12d3-a456-426614174000
        fullName:
          type: string
          example: Jean Dupont
        targetSector:
          type: string
          nullable: true
          example: Software Development
        location:
          type: string
          nullable: true
          example: Paris
        avatarUrl:
          type: string
          nullable: true
          example: /uploads/avatars/1725360000000-123456789.jpg
        bio:
          type: string
          nullable: true
          example: Développeuse passionnée par le web accessible.
        certificationScore:
          type: integer
          nullable: true
          example: 85
        hasCertificationBadge:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
    ProfileInput:
      type: object
      properties:
