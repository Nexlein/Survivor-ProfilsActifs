openapi: 3.0.0
info:
  title: ProfilsActifs API
  description: TikTok for the unemployed - Core API Documentation
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Verifies application and database connectivity.
      tags:
        - System
      responses:
        "200":
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    example: "2026-09-01T12:00:00.000Z"
        "503":
          description: Service Unavailable (Database is down).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      summary: User Registration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - fullName
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
                fullName:
                  type: string
                  example: Jean Dupont
                role:
                  type: string
                  enum:
                    - JOB_SEEKER
                    - RECRUITER
                  example: JOB_SEEKER
                dateOfBirth:
                  type: string
                  example: "1998-05-14"
                targetSector:
                  type: string
                  example: Informatique
                location:
                  type: string
                  example: Paris, France
                skills:
                  type: array
                  items:
                    type: string
                  maxItems: 10
                  example:
                    - React
                    - Node.js
                companyName:
                  type: string
                  example: TechCorp
                industry:
                  type: string
                  example: Logiciel
                position:
                  type: string
                  example: CTO
      responses:
        "201":
          description: User created successfully
        "400":
          description: Bad request (missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Age restriction violation (<16 years)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: jean.dupont@example.fr
                password:
                  type: string
                  example: Password123!
      responses:
        "200":
          description: Successful login, returns JWT token
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/get-current-user:
    get:
      summary: Get Current User
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful retrieval of current user
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
  /auth/refresh:
    post:
      summary: Refresh JWT Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description:
            Token refreshed successfully, returns new JWT token and user
            info
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000
                      email:
                        type: string
                        example: jean.dupont@example.fr
                      role:
                        type: string
                        enum:
                          - JOB_SEEKER
                          - RECRUITER
                        example: JOB_SEEKER
        "401":
          description: Unauthorized (Invalid or missing token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile:
    get:
      summary: Get Profile of Current User
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile object retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                targetSector:
                  type: string
                location:
                  type: string
                companyName:
                  type: string
                industry:
                  type: string
                position:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
                  maxItems: 10
                visible:
                  type: boolean
                  description:
                    Toggles the public visibility of the profile (defaults
                    to true)
                dateOfBirth:
                  type: string
                  format: date-time
                  description:
                    Required to be >= 16 years old to activate profile
                    visibility
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete Current User Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/me:
    get:
      summary: Consult Active Profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active profile details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/avatar:
    post:
      summary: Upload / replace profile photo
      description:
        Accepts a single image file (max 5 MB) and sets it as the current
        user's avatarUrl.
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded and profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: No file provided or invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/all:
    get:
      summary: Get All Profiles
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of all user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/user/{id}:
    get:
      summary: Get Profile by User ID
      tags:
        - Profile
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Acc\xE8s interdit (Profil de mineur)"
  /video/get:
    get:
      summary: Get Video Profile
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Video retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Video ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video/like:
    post:
      summary: Like a Video
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Video liked successfully (likes count incremented)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Video ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video/view:
    post:
      summary: Register a Video View
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Video view registered successfully (views count incremented)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Video ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compliance/data-export:
    get:
      summary: Personal Data Export (GDPR)
      description:
        Right of access to data. Returns all personal data associated with
        the account.
      tags:
        - Compliance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export successful
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /compliance/account:
    delete:
      summary: Right to be Forgotten (GDPR)
      description:
        Full and permanent account deletion, including physical files (.mp4,
        .vtt).
      tags:
        - Compliance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion successful
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/{id}:
    get:
      summary: Stream a video
      tags:
        - Media
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Full video stream
        "206":
          description: Partial video stream (Range)
        "403":
          description: Forbidden (Video is PENDING or REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video/feed:
    get:
      summary: Get public video feed
      tags:
        - Video
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated video feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
  /video/approval:
    put:
      summary: Approve or reject a video (ADMIN only)
      tags:
        - Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - approved
              properties:
                id:
                  type: string
                  format: uuid
                approved:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Video updated
        "400":
          description: Reason required if rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/videos:
    post:
      summary: Upload or link a new video to the profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - UPLOAD
                    - LINK
                videoUrl:
                  type: string
                  description: Required if type is LINK
                consentTextVersion:
                  type: string
                video:
                  type: string
                  format: binary
                  description: Required if type is UPLOAD
                subtitle:
                  type: string
                  format: binary
      responses:
        "201":
          description: Video created
  /profile/videos/{id}:
    delete:
      summary: Delete a video physically and logically
      tags:
        - Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          format: uuid
          example: 987f6543-e21b-12d3-a456-426614174000
        fullName:
          type: string
          example: Jean Dupont
        targetSector:
          type: string
          nullable: true
          example: Software Development
        location:
          type: string
          nullable: true
          example: Paris
        avatarUrl:
          type: string
          nullable: true
          example: /uploads/avatars/1725360000000-123456789.jpg
        certificationScore:
          type: integer
          nullable: true
          example: 85
        hasWorkPermit:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
    ProfileInput:
      type: object
      properties:
        fullName:
          type: string
          example: Jean Dupont
        targetSector:
          type: string
          example: Software Development
        location:
          type: string
          example: Paris
        certificationScore:
          type: integer
          example: 85
        hasWorkPermit:
          type: boolean
          example: true
    Video:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        profileId:
          type: string
          format: uuid
          example: 987f6543-e21b-12d3-a456-426614174000
        type:
          type: string
          enum:
            - LINK
            - UPLOAD
          example: UPLOAD
        url:
          type: string
          example: /uploads/videos/172528765-video.mp4
        subtitleUrl:
          type: string
          nullable: true
          example: null
        consentDate:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
        consentTextVersion:
          type: string
          example: v1.0
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
          example: PENDING
        rejectionReason:
          type: string
          nullable: true
          example: Inappropriate content
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Description d\xE9taill\xE9e de l'erreur."
